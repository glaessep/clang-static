name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A newer run of the same ref replaces an older one that still builds.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ninja if missing
        run: |
          if ! command -v ninja > /dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install ninja
            else
              sudo apt-get update
              sudo apt-get install -y ninja-build
            fi
          fi

      - name: Build
        run: |
          start=$(date +%s)
          ./build.sh "${{ matrix.platform }}"
          echo "build time: $(( $(date +%s) - start )) s"

      - name: Smoke test
        run: |
          version=$(sed -n 's/^LLVM_VERSION=//p' llvm.version)
          ./smoke/run.sh "out/clang-static-${version}-${{ matrix.platform }}"

      - name: Package size
        run: ls -l out/*.tar.xz && du -sh out/clang-static-*/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clang-static-${{ matrix.platform }}
          path: |
            out/*.tar.xz
            out/*.tar.xz.sha256
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          # The tag may come with a release drafted by hand. Create one only if none exists.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" --notes "Static Clang libraries. Check files against SHA256SUMS."
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            ./*.tar.xz ./*.sha256 SHA256SUMS
